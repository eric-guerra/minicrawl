[project]
name = "minicrawl"
version = "1.0.0"
description = "Polite web crawler, BM25 + PageRank search engine and Hadoop Streaming indexer"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
minicrawl = "minicrawl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
